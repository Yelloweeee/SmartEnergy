<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <title>Grid Pulse - Appliances</title>
</head>
<body data-page="appliances">
  <div class="wrap">
    <header>
      <div>
        <div class="brand-row">
          <span class="live-dot" aria-hidden="true"></span>
          <h1>Grid Pulse</h1>
        </div>
        <p class="tagline">Appliances that wait for clean grid power - not the moment you press start.</p>
      </div>
      <span class="zone-label">Zone: <span id="zoneDisplay">IN-KA</span></span>
    </header>
    <div class="page-actions appliance-actions" aria-label="Simulation controls">
      <button class="control-button play-toggle" type="button" data-play-toggle aria-pressed="true">Pause</button>
      <div class="speed-control" role="group" aria-label="Simulation speed">
        <button class="speed-button" type="button" data-speed="0.5">0.5x</button>
        <button class="speed-button" type="button" data-speed="1">1x</button>
        <button class="speed-button" type="button" data-speed="2">2x</button>
        <button class="speed-button" type="button" data-speed="4">4x</button>
      </div>
      <a class="nav-button" href="analysis.html">View Analysis</a>
    </div>
<!-- ========== TOP ZONE: Hub scene ========== -->
    <section class="hub" aria-label="Smart home hub">
      <div class="hub-stage" id="hubStage">
        <!-- Cord + plug overlay -->
        <svg class="cords-layer" id="cordsLayer" aria-hidden="true">
          <path class="cord-path" id="cord-washer" d="" />
          <path class="cord-path" id="cord-ev" d="" />
          <path class="cord-path" id="cord-dishwasher" d="" />

          <g class="plug-mover" id="plug-washer">
            <rect class="plug-body" x="-7" y="-11" width="14" height="18" rx="2.5" />
            <rect class="plug-prong" x="7" y="-5" width="6" height="3.5" rx="0.5" />
            <rect class="plug-prong" x="7" y="2" width="6" height="3.5" rx="0.5" />
          </g>
          <g class="plug-mover" id="plug-ev">
            <rect class="plug-body" x="-7" y="-11" width="14" height="18" rx="2.5" />
            <rect class="plug-prong" x="7" y="-5" width="6" height="3.5" rx="0.5" />
            <rect class="plug-prong" x="7" y="2" width="6" height="3.5" rx="0.5" />
          </g>
          <g class="plug-mover" id="plug-dishwasher">
            <rect class="plug-body" x="-7" y="-11" width="14" height="18" rx="2.5" />
            <rect class="plug-prong" x="7" y="-5" width="6" height="3.5" rx="0.5" />
            <rect class="plug-prong" x="7" y="2" width="6" height="3.5" rx="0.5" />
          </g>
        </svg>

        <!-- Washer - upper left -->
        <div class="device device-washer" id="device-washer" data-id="washer">
          <div class="illust-wrap">
            <svg class="illust" viewBox="0 0 100 100" fill="none">
              <rect class="body-fill body-stroke" x="16" y="10" width="68" height="80" rx="7" />
              <rect class="muted-fill" x="22" y="16" width="56" height="12" rx="3" />
              <circle class="accent-fill" cx="32" cy="22" r="2.4" />
              <circle class="accent-fill" cx="42" cy="22" r="2.4" />
              <circle class="accent-fill" cx="52" cy="22" r="2.4" />
              <circle class="body-stroke" cx="50" cy="56" r="24" />
              <g class="washer-drum">
                <circle class="inner-fill" cx="50" cy="56" r="18.5" />
                <circle class="detail-stroke" cx="50" cy="56" r="18.5" />
                <path class="detail-stroke" d="M50 42v9M60 51l-7 5.5M55.5 66l-5.5-7M44.5 66l5.5-7M40 51l7 5.5" opacity="0.55" />
              </g>
              <rect class="muted-fill" x="76" y="50" width="4" height="12" rx="1.5" />
            </svg>
          </div>
          <div class="cord-anchor cord-anchor-out" data-anchor="washer"></div>
          <p class="device-name">Washing machine</p>
          <p class="device-status" data-status>WAITING</p>
          <p class="device-meta" data-optimal>-</p>
        </div>

        <!-- EV - upper right -->
        <div class="device device-ev" id="device-ev" data-id="ev">
          <div class="illust-wrap">
            <svg class="illust" viewBox="0 0 100 100" fill="none">
              <rect class="muted-fill" x="12" y="14" width="9" height="60" rx="2" opacity="0.5" />
              <rect class="body-fill body-stroke" x="18" y="16" width="42" height="58" rx="9" />
              <rect class="inner-fill" x="26" y="24" width="26" height="14" rx="3" />
              <rect class="detail-stroke" x="26" y="24" width="26" height="14" rx="3" />
              <circle class="ev-status-light" cx="39" cy="52" r="4.5" />
              <circle class="detail-stroke" cx="39" cy="52" r="4.5" />
              <circle class="muted-fill" cx="50" cy="66" r="6.5" />
              <circle class="detail-stroke" cx="50" cy="66" r="6.5" />
              <path class="detail-stroke" d="M56 68 C66 72, 70 62, 74 56" stroke-width="2.75" />
              <g class="ev-plug-head">
                <rect class="body-fill body-stroke" x="68" y="44" width="18" height="24" rx="3.5" />
                <rect class="accent-fill" x="73" y="50" width="3.5" height="7" rx="0.7" />
                <rect class="accent-fill" x="79" y="50" width="3.5" height="7" rx="0.7" />
                <rect class="muted-fill" x="74" y="41" width="6" height="4" rx="1" />
              </g>
            </svg>
          </div>
          <div class="cord-anchor cord-anchor-out" data-anchor="ev"></div>
          <p class="device-name">EV charger</p>
          <p class="device-status" data-status>WAITING</p>
          <p class="device-meta" data-optimal>-</p>
        </div>

        <!-- Dishwasher - below center -->
        <div class="device device-dishwasher" id="device-dishwasher" data-id="dishwasher">
          <div class="illust-wrap">
            <svg class="illust" viewBox="0 0 100 100" fill="none">
              <rect class="body-fill body-stroke" x="17" y="10" width="66" height="80" rx="6" />
              <rect class="muted-fill" x="23" y="16" width="54" height="13" rx="3" />
              <rect class="dw-display" x="28" y="19.5" width="24" height="6" rx="1.5" />
              <circle class="accent-fill" cx="62" cy="22.5" r="2.2" />
              <circle class="accent-fill" cx="70" cy="22.5" r="2.2" />
              <line class="detail-stroke" x1="23" y1="34" x2="77" y2="34" />
              <rect class="inner-fill" x="30" y="40" width="40" height="8" rx="2" />
              <line class="dw-handle detail-stroke" x1="34" y1="44" x2="66" y2="44" stroke-width="2.5" />
              <rect class="detail-stroke" x="24" y="54" width="52" height="28" rx="3" opacity="0.75" />
              <path class="detail-stroke" d="M34 64h32M34 70h22" opacity="0.4" />
            </svg>
          </div>
          <div class="cord-anchor cord-anchor-out" data-anchor="dishwasher"></div>
          <p class="device-name">Dishwasher</p>
          <p class="device-status" data-status>WAITING</p>
          <p class="device-meta" data-optimal>-</p>
        </div>

        <!-- Central socket board -->
        <div class="socket-board" id="socketBoard" aria-hidden="true">
          <svg viewBox="0 0 320 110" fill="none">
            <rect class="board-body" x="8" y="18" width="304" height="74" rx="10" />
            <rect class="board-edge" x="8" y="18" width="304" height="12" rx="4" opacity="0.5" />
            <!-- Slot 0 - washer -->
            <g class="slot" id="slot-washer" data-slot="0">
              <rect class="slot-face" x="42" y="40" width="48" height="38" rx="4" />
              <rect class="slot-hole" x="54" y="50" width="7" height="12" rx="1" />
              <rect class="slot-hole" x="71" y="50" width="7" height="12" rx="1" />
              <circle class="slot-led" cx="66" cy="34" r="3.5" />
            </g>
            <!-- Slot 1 - EV -->
            <g class="slot" id="slot-ev" data-slot="1">
              <rect class="slot-face" x="136" y="40" width="48" height="38" rx="4" />
              <rect class="slot-hole" x="148" y="50" width="7" height="12" rx="1" />
              <rect class="slot-hole" x="165" y="50" width="7" height="12" rx="1" />
              <circle class="slot-led" cx="160" cy="34" r="3.5" />
            </g>
            <!-- Slot 2 - dishwasher -->
            <g class="slot" id="slot-dishwasher" data-slot="2">
              <rect class="slot-face" x="230" y="40" width="48" height="38" rx="4" />
              <rect class="slot-hole" x="242" y="50" width="7" height="12" rx="1" />
              <rect class="slot-hole" x="259" y="50" width="7" height="12" rx="1" />
              <circle class="slot-led" cx="254" cy="34" r="3.5" />
            </g>
            <!-- End caps / feet -->
            <rect class="board-edge" x="20" y="88" width="18" height="6" rx="2" />
            <rect class="board-edge" x="282" y="88" width="18" height="6" rx="2" />
          </svg>
          <div class="slot-anchor" data-slot="0" data-anchor="washer"></div>
          <div class="slot-anchor" data-slot="1" data-anchor="ev"></div>
          <div class="slot-anchor" data-slot="2" data-anchor="dishwasher"></div>
        </div>
      </div>
    </section>
  </div>

  <div class="toast-stack" id="toastStack" aria-live="polite"></div>
  <script src="script.js"></script>
</body>
</html>
